name: Reference2Video checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py job_store.py media_store.py tests
      - name: Run storage regression tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check static/app.js
      - name: Check video worker JavaScript syntax
        run: node --check scripts/generate-video.mjs
