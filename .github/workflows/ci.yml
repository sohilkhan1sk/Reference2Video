name: Reference2Video checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py assembly.py subtitle_tracks.py job_store.py media_store.py media_probe.py tests
      - name: Run storage and assembly regression tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: node --check static/app.js
      - name: Check audio timeline module syntax
        run: node --check static/audio_timeline.js
      - name: Test audio timeline calculations
        run: node --test tests/test_audio_timeline.js
      - name: Check audio preview module syntax
        run: node --check static/audio_preview.js
      - name: Test audio preview planning and waveforms
        run: node --test tests/test_audio_preview.js
      - name: Check synchronized video preview module syntax
        run: node --check static/assembly_video_preview.js
      - name: Test synchronized video sequence planning
        run: node --test tests/test_assembly_video_preview.js
      - name: Check video worker JavaScript syntax
        run: node --check scripts/generate-video.mjs
      - name: Install Node package dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium
      - name: Generate synthetic browser video fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p tests/browser/fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=red:s=320x180:r=30 -t 3 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart -y tests/browser/fixtures/red.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=320x180:r=30 -t 3 -an -c:v libx264 -pix_fmt yuv420p -movflags +faststart -y tests/browser/fixtures/blue.mp4
      - name: Run browser-level crossfade preview tests
        run: npx playwright test --config tests/browser/playwright.config.mjs
